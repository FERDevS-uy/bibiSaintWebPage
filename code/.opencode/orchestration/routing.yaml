# Routing Matrix — Bibi Saint v4

El coordinator usa la ruta mínima suficiente. Los modelos viven solo en `opencode.json`.

## Agentes

| Agente | Rol | Steps |
|---|---|---:|
| `coordinator` | clasifica y rutea | 5 |
| `locator` | ubica targets read-only | 4 |
| `diagnostic` | confirma causa/contrato | 7 |
| `expert` | resuelve escalaciones | 8 |
| `implementer` | único editor | 14 |
| `qa` | verificación mecánica | 7 |
| `reviewer` | revisión semántica final | 6 |
| `dba` | DB excepcional | 10 |
| `security` | auditoría read-only | 8 |
| `provider-scraper` | proveedor excepcional | 9 |

## Rutas

### PRE_DIAGNOSED

El usuario ya entrega diagnóstico/contrato suficiente.

```text
coordinator → implementer → qa → reviewer
```

No locator. No diagnostic.

### FAST_KNOWN

Cambio mecánico, bajo riesgo, target conocido.

```text
coordinator → implementer → qa
```

### FAST_LOCATE

Cambio mecánico, bajo riesgo, solución clara; falta ubicar target.

```text
coordinator → locator → implementer → qa
```

### NORMAL

Causa no confirmada o superficie de regresión razonable.

```text
coordinator → locator → diagnostic (DIRECT) → implementer → qa → reviewer
```

### COMPLEX / HIGH_RISK

```text
coordinator → locator → diagnostic (ESCALATE_TO_EXPERT) → expert → implementer → qa → reviewer
```

### DB/RLS/migraciones

```text
coordinator → locator → diagnostic → dba → implementer → qa → reviewer
```

### Scrapers/transporte

```text
coordinator → locator → diagnostic → provider-scraper → implementer → qa → reviewer
```

### Seguridad

```text
coordinator → security
```

## Reglas de routing

1. `locator` NO es obligatorio por defecto.
2. Si el usuario entrega un contrato PRE_DIAGNOSED completo, no repetir discovery/diagnosis.
3. `diagnostic` solo entra cuando la causa/solución no está suficientemente confirmada.
4. `expert` solo entra por `ESCALATE_TO_EXPERT`.
5. `reviewer` es obligatorio en PRE_DIAGNOSED no trivial, NORMAL, COMPLEX y ramas de riesgo; se omite en FAST salvo necesidad real.
6. Escritura secuencial: solo `implementer` edita producción.
7. QA y reviewer son independientes y read-only.
8. Máximo 2 ciclos de corrección; el segundo bloqueo escala al usuario.
9. Retry sin evidencia nueva: prohibido.
10. Handoffs compactos según `instructions/harness.md`.

## Task permissions del coordinator

La whitelist está enforced en `opencode.json`:

```yaml
task:
  "*": deny
  locator: allow
  diagnostic: allow
  expert: allow
  implementer: allow
  qa: allow
  reviewer: allow
  dba: allow
  security: allow
  provider-scraper: allow
```
