version: 1
source_of_truth:
  runtime: global-opencode-plus-gentle
  local: code/.opencode

local_capabilities:
  skills:
    - bibi-database
    - bibi-security
    - bibi-providers
  commands:
    - opsx-apply
    - opsx-archive
    - opsx-explore
    - opsx-propose
    - opsx-sync
    - opsx-update

rules:
  - Keep routing and model ownership in global runtime settings.
  - Use local skills for domain constraints in this repository.
  - Do not reintroduce legacy local agent pipeline documents as runtime truth.
