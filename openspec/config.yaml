schema: spec-driven

context: |
  **Tech Stack**: Astro 5 SSR + Cloudflare Workers + React Islands + Supabase
  
  **Multi-Agent Orchestration** (CRITICAL):
  - Frontend tasks (UI/design/CSS) → @bibi-designer (design skills only)
  - Backend tasks (API/logic/auth) → @bibi-implementer (full codebase + DB skills)
  - Full-stack features → BOTH in parallel (designer + implementer)
  - Database changes → @bibi-dba (supabase-postgres-best-practices)
  
  **Best Practices Enforced per Specialist**:
  - Designer: Anti-slop design, 1000px max-width container, mobile-first, accessibility-first
  - Implementer: Strict TypeScript, CSS modules, server-side validation, RLS policies
  - DBA: Query optimization, migration safety, column type selection, index strategy
  
  **Code Conventions**:
  - TypeScript strict mode
  - CSS modules (scoped, no globals)
  - Astro components for server rendering (no vanilla JS for initial load)
  - Client hydration: client:load, client:idle, client:visible
  - View Transitions: astro:page-load (NOT DOMContentLoaded - breaks with View Transitions)
  - Max container width: 1000px centered
  - Path aliases: @components/*, @layouts/*, @utils/*, @server/*, @stores/*
  
  **Design System**:
  - High-end visual (premium, not generic AI patterns)
  - Responsive breakpoints: mobile (<999px), desktop (1000px+)
  - Spring animations (Apple-style, interruptible transitions)
  - Accessibility: WCAG 2.1 AA compliant
  
  **Database**:
  - Supabase PostgreSQL (project: deilsclvheqcrqswiafa)
  - Dual-read: Supabase first, CSV fallback
  - RLS policies: MANDATORY for authenticated writes
  - Migrations: /code/supabase/migrations/ (001_initial_schema.sql, 002_security_hardening.sql)
  - Product tables: products, product_images, product_related
  
  **Deployment**:
  - Cloudflare Workers (worker name: bibisaintwebpage)
  - GitHub Actions CI/CD (.github/workflows/cloudflare-deploy.yml)
  - Environment: production (secrets required)
  
  **Auto-Save System**:
  - Decisions + quick wins → .agents/autosave/ (brevedad)
  - Design + code artifacts → .agents/autosave/resu.md (detalles linkeados)
  - Cross-session jump via resu.md references
  
  **Testing Strategy** (Token-Optimized):
  - Use Playwright CLI directly (NOT MCP - significant token savings)
  - Tests stored in /tests/ or /e2e/ directory
  - CI runs via `pnpm exec playwright test` in GitHub Actions
  - Local dev: `pnpm exec playwright test --watch` for hot reload
  - Debug mode: `pnpm exec playwright test --debug` (step through code)
  - UI mode: `pnpm exec playwright test --ui` (visual test editor, no agent needed)
  - @bibi-qa writes tests, but runs them via CLI to validate

rules:
  proposal:
    - Analyze frontend vs backend vs database requirements upfront
    - Recommend parallel specialist routing if full-stack (saves 38% time)
    - Always link to existing patterns in .agents/autosave/resu.md if available
    - Include "Not included" section for scope clarity
    - Reference relevant design tokens or API contracts
  
  tasks:
    - Break tasks into max 2-3 hour chunks
    - Tag with @bibi-designer, @bibi-implementer, or @bibi-dba (specialist owner)
    - If full-stack: separate tasks per specialist, note dependencies
    - Include acceptance criteria (testable, measurable)
    - Link to design mockup or API spec in .agents/autosave/resu.md

operations:
  propose:
    guidance:
      - Use coordinator decision tree (see .agents/orchestration/openspec-orchestration.md)
      - Identify specialist(s) needed before drafting tasks
      - For full-stack: recommend parallel execution + auto-save checkpoints
      - Reference .agents/autosave/resu.md patterns if similar work exists
      - Estimate token savings vs monolithic approach
  
  apply:
    guidance:
      - If full-stack: trigger designer and implementer tasks in parallel
      - Designer creates mockups + CSS blueprint → saves to .agents/autosave/resu.md
      - Implementer reads design from .agents/autosave/resu.md, creates API + types
      - Auto-checkpoint after each specialist milestone
      - For cross-session handoff: link tasks to resu.md sections
      - Run full test suite (E2E + unit) before sign-off
      - Testing with Playwright CLI (not MCP, to save tokens):
        * Run: `pnpm exec playwright test` (headless, all browsers)
        * Debug: `pnpm exec playwright test --debug` (interactive)
        * UI mode: `pnpm exec playwright test --ui` (visual test editor)
        * Specific file: `pnpm exec playwright test tests/product.spec.ts`
        * Keep test files in /tests/ directory
        * Don't use MCP playwright recorder - write tests manually or use CLI `--record` flag
  
  archive:
    guidance:
      - Merge specialist outputs into single coherent spec
      - Create comprehensive design → code → test summary
      - Link .agents/autosave/resu.md sections for continuity across sessions
      - Update design tokens or API guidelines if new patterns introduced
      - Note which specialist(s) touched this, for knowledge transfer
      - Close with "Ready for production" or "Next specialist: [name]"
